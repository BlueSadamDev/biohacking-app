name: Build APK de développement

# APK de développement (avec expo-dev-client) : se recharge depuis `npx expo start`.
# À reconstruire seulement quand une dépendance native ou une permission change.
# Installé sous le nom "Aube (dev)", à côté de l'app de production.
# Signé avec la clé de développement standard d'Expo : aucun secret nécessaire.
# Déclenchement uniquement manuel : onglet Actions > "Run workflow".
on:
  workflow_dispatch:

jobs:
  build-dev-apk:
    runs-on: ubuntu-latest
    env:
      # Supprime les warnings npm pour que expo-modules-autolinking
      # puisse parser la sortie JSON de npm list --json (erreur generateInlineModules)
      npm_config_warn: "false"

    steps:
      - name: Récupérer le code source
        uses: actions/checkout@v7

      - name: Installer Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances du projet
        run: npm ci --no-audit --no-fund

      - name: Installer Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Identifiant et nom propres au build de développement
        run: |
          VERSION_CODE=$((1 + GITHUB_RUN_NUMBER))
          jq ".expo.android.package = \"com.bluesadamdev.biohacking.dev\"
            | .expo.name = \"Aube (dev)\"
            | .expo.android.versionCode = $VERSION_CODE" app.json > app.json.tmp && mv app.json.tmp app.json
          echo "versionCode : $VERSION_CODE"

      - name: Générer le projet natif Android
        run: npx expo prebuild --platform android --no-install

      - name: Compiler l'APK de développement
        run: |
          chmod +x android/gradlew
          cd android && ./gradlew assembleDebug --no-daemon

      - name: Déposer l'APK (artefact téléchargeable)
        uses: actions/upload-artifact@v7
        with:
          name: biohacking-dev-apk
          path: android/app/build/outputs/apk/debug/*.apk
