name: Build APK de production

# APK de production, pour l'usage au quotidien.
# Sans permission Internet : aucune donnée ne peut quitter le téléphone.
# Le build échoue si la permission Internet est encore présente dans l'APK final.
# Déclenchement uniquement manuel : onglet Actions > "Run workflow".
on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      # Supprime les warnings npm pour que expo-modules-autolinking
      # puisse parser la sortie JSON de npm list --json (erreur generateInlineModules)
      npm_config_warn: "false"

    steps:
      - name: Récupérer le code source
        uses: actions/checkout@v7

      - name: Vérifier que les 4 secrets de signature sont présents
        run: |
          for S in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_PASSWORD ANDROID_KEY_ALIAS; do
            if [ -z "${!S}" ]; then echo "ERREUR : secret $S manquant – ajoute-le dans Settings > Secrets and variables > Actions"; exit 1; fi
          done
          echo "Les 4 secrets de signature sont présents"

      - name: Installer Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances du projet
        run: npm ci --no-audit --no-fund

      - name: Installer Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Retirer Internet et l'affichage par-dessus les autres apps, injecter le versionCode
        run: |
          VERSION_CODE=$((1 + GITHUB_RUN_NUMBER))
          jq ".expo.android.blockedPermissions += [\"android.permission.INTERNET\", \"android.permission.SYSTEM_ALERT_WINDOW\"]
            | .expo.android.versionCode = $VERSION_CODE" app.json > app.json.tmp && mv app.json.tmp app.json
          echo "versionCode : $VERSION_CODE"
          jq ".expo.android.blockedPermissions" app.json

      - name: Générer le projet natif Android
        run: npx expo prebuild --platform android --no-install

      - name: Restaurer la clé de signature
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/biohacking-release.keystore

      - name: Configurer la signature de l'APK
        run: python3 .github/patch_build_gradle.py

      - name: Compiler l'APK release
        run: |
          chmod +x android/gradlew
          cd android && ./gradlew assembleRelease --no-daemon \
            -PBIOHACK_STORE_FILE=biohacking-release.keystore \
            -PBIOHACK_KEY_ALIAS="$ANDROID_KEY_ALIAS" \
            -PBIOHACK_STORE_PASSWORD="$ANDROID_KEYSTORE_PASSWORD" \
            -PBIOHACK_KEY_PASSWORD="$ANDROID_KEY_PASSWORD"

      - name: Vérifier que l'APK n'a pas la permission Internet
        run: |
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt | sort -V | tail -1)
          APK=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          echo "Permissions de l'APK :"
          "$AAPT" dump permissions "$APK"
          if "$AAPT" dump permissions "$APK" | grep -q "android.permission.INTERNET"; then
            echo "ERREUR : l'APK de production contient la permission Internet"; exit 1
          fi
          echo "OK : pas de permission Internet"

      - name: Déposer l'APK (artefact téléchargeable)
        uses: actions/upload-artifact@v7
        with:
          name: biohacking-apk
          path: android/app/build/outputs/apk/release/*.apk

      - name: Nettoyer le keystore décodé
        if: always()
        run: rm -f android/app/biohacking-release.keystore
